    // --- App Component ---
    function App() {
      const [role, setRole] = useState("SALES_REP"); // 'SALES_REP' or 'ADMIN'
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [pendingSyncCount, setPendingSyncCount] = useState(0);
      
      // Data State
      const [clients, setClients] = useState(SEED_CLIENTS);
      const [products, setProducts] = useState(SEED_PRODUCTS);
      const [orders, setOrders] = useState([]);
      const [creditNotes, setCreditNotes] = useState([]);
      
      // Attendance & Geo
      const [isPunchedIn, setIsPunchedIn] = useState(false);
      const [punchInTime, setPunchInTime] = useState(null);
      const [currentRepLat, setCurrentRepLat] = useState(18.6273); // MIDC Bhosari coordinates
      const [currentRepLng, setCurrentRepLng] = useState(73.8438);

      // Active Booking Session
      const [selectedClient, setSelectedClient] = useState(SEED_CLIENTS[0]);
      const [invoiceSeries, setInvoiceSeries] = useState("GST_INVOICE"); // 'GST_INVOICE' or 'NON_GST_ESTIMATE'
      const [cart, setCart] = useState([]);
      const [paidTodayInput, setPaidTodayInput] = useState(0);
      const [isSplitDispatch, setIsSplitDispatch] = useState(false);

      // Modals
      const [activeModal, setActiveModal] = useState(null); // 'WHATSAPP_SHARE', 'SALES_RETURN', 'PAYROLL_SLIP', 'ADD_CLIENT'
      const [lastGeneratedOrder, setLastGeneratedOrder] = useState(null);
      const [returnForm, setReturnForm] = useState({ invoiceNo: "", qty: 1, reason: "", destination: "RESELLABLE" });

      // Financial Year Sequence
      const [gstCounter, setGstCounter] = useState(43);
      const [estCounter, setEstCounter] = useState(19);
      const [cnCounter, setCnCounter] = useState(10);

      // Network Listener
      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          if (pendingSyncCount > 0) {
            alert(`Network reconnected! Synchronized ${pendingSyncCount} offline orders with Firebase server.`);
            setPendingSyncCount(0);
          }
        };
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, [pendingSyncCount]);

      // Calculate Distance (Haversine)
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 999;
        const R = 6371e3;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      };

      // Check 100m Geofence for current selected client
      const clientDistance = useMemo(() => {
        return calculateDistance(currentRepLat, currentRepLng, selectedClient.lat, selectedClient.lng);
      }, [currentRepLat, currentRepLng, selectedClient]);

      const isWithin100m = clientDistance <= 100;

      // Handle GPS Punch
      const togglePunch = () => {
        if (!isPunchedIn) {
          setIsPunchedIn(true);
          setPunchInTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        } else {
          if (confirm("Do you want to Punch-out for the day?")) {
            setIsPunchedIn(false);
            setPunchInTime(null);
          }
        }
      };

      // Cart Operations
      const addToCart = (product, qty = 1) => {
        const availableStock = product.physical - product.booked;
        if (availableStock <= 0) {
          alert(`Product ${product.name} is currently Out-of-Stock! Please choose an alternative substitute below.`);
          return;
        }

        const existing = cart.find(item => item.product_id === product.id);
        const currentCartQty = existing ? existing.quantity : 0;
        if (currentCartQty + qty > availableStock) {
          alert(`Cannot book more than Available stock (${availableStock} units).`);
          return;
        }

        if (existing) {
          setCart(cart.map(item => item.product_id === product.id ? { ...item, quantity: item.quantity + qty } : item));
        } else {
          setCart([...cart, {
            product_id: product.id,
            name: product.name,
            sku: product.sku,
            price: product.price,
            tax_rate: product.tax_rate,
            hsn: product.hsn,
            quantity: qty
          }]);
        }
      };

      const removeFromCart = (productId) => {
        setCart(cart.filter(item => item.product_id !== productId));
      };

      // Billing Engine Calculations
      const billSummary = useMemo(() => {
        let subtotal = 0;
        let cgst = 0;
        let sgst = 0;
        let igst = 0;

        cart.forEach(item => {
          const itemTaxable = item.price * item.quantity;
          subtotal += itemTaxable;

          if (invoiceSeries === "GST_INVOICE") {
            const taxRate = item.tax_rate || 18;
            const taxAmt = (itemTaxable * taxRate) / 100;
            if (selectedClient.state_code === SEED_COMPANY.state_code) {
              cgst += taxAmt / 2;
              sgst += taxAmt / 2;
            } else {
              igst += taxAmt; // Inter-state
            }
          }
        });

        const totalTax = cgst + sgst + igst;
        const currentOrderTotal = subtotal + totalTax;
        const previousOutstanding = selectedClient.outstanding || 0;
        const paidToday = Number(paidTodayInput) || 0;
        
        // Exact Formula: [Current Order Total] + [Previous Outstanding] - [Paid Today] = [Net Balance Due]
        const netBalanceDue = Math.max(0, currentOrderTotal + previousOutstanding - paidToday);

        return {
          subtotal,
          cgst,
          sgst,
          igst,
          totalTax,
          currentOrderTotal,
          previousOutstanding,
          paidToday,
          netBalanceDue
        };
      }, [cart, invoiceSeries, selectedClient, paidTodayInput]);

      // Complete Order & Commit Inventory
      const handleCreateOrder = () => {
        if (!isPunchedIn) {
          alert("Please Punch-in your GPS attendance before booking orders!");
          return;
        }
        if (cart.length === 0) {
          alert("Your order cart is empty! Please add products.");
          return;
        }

        let docNo = "";
        if (invoiceSeries === "GST_INVOICE") {
          docNo = `INV/26-27/${String(gstCounter).padStart(4, "0")}`;
          setGstCounter(prev => prev + 1);
        } else {
          docNo = `EST/26-27/${String(estCounter).padStart(4, "0")}`;
          setEstCounter(prev => prev + 1);
        }

        const newOrder = {
          id: `ord-${Date.now()}`,
          invoice_number: docNo,
          invoice_series: invoiceSeries,
          client_id: selectedClient.id,
          client_name: selectedClient.company_name,
          client_phone: selectedClient.phone,
          order_channel: isWithin100m ? "FIELD_VISIT" : "PHONE_CALL",
          is_geofence_verified: isWithin100m,
          order_date: new Date().toISOString().split("T")[0],
          items: [...cart],
          ...billSummary
        };

        // 1. Commit 3-Way Inventory (Booked Stock += Order Qty)
        setProducts(prevProducts =>
          prevProducts.map(p => {
            const item = cart.find(ci => ci.product_id === p.id);
            if (item) {
              const newBooked = p.booked + item.quantity;
              return { ...p, booked: newBooked };
            }
            return p;
          })
        );

        // 2. Update Client Outstanding Balance
        setClients(prevClients =>
          prevClients.map(c =>
            c.id === selectedClient.id ? { ...c, outstanding: billSummary.netBalanceDue } : c
          )
        );

        // 3. Add to orders
        setOrders([newOrder, ...orders]);
        setLastGeneratedOrder(newOrder);

        // Offline check
        if (!isOnline) {
          setPendingSyncCount(prev => prev + 1);
        }

        // Reset Cart
        setCart([]);
        setPaidTodayInput(0);
        setActiveModal('WHATSAPP_SHARE');
      };

      // Sales Return Execution
      const handleProcessReturn = (e) => {
        e.preventDefault();
        const prod = products.find(p => p.id === "p-001");
        const docNo = `CN/26-27/${String(cnCounter).padStart(4, "0")}`;
        setCnCounter(prev => prev + 1);

        const refundAmt = (Number(returnForm.qty) || 1) * prod.price;

        // Restock goods (Resellable adds to Physical; Damaged adds to Damaged)
        setProducts(prev =>
          prev.map(p => {
            if (p.id === prod.id) {
              if (returnForm.destination === "RESELLABLE") {
                return { ...p, physical: p.physical + Number(returnForm.qty) };
              } else {
                return { ...p, damaged: p.damaged + Number(returnForm.qty) };
              }
            }
            return p;
          })
        );

        // Deduct from client balance
        setClients(prev =>
          prev.map(c =>
            c.id === selectedClient.id ? { ...c, outstanding: Math.max(0, c.outstanding - refundAmt) } : c
          )
        );

        const newCreditNote = {
          docNo,
          invoiceNo: returnForm.invoiceNo || "INV/26-27/0041",
          clientName: selectedClient.company_name,
          amount: refundAmt,
          qty: returnForm.qty,
          destination: returnForm.destination,
          reason: returnForm.reason || "Client requirement changed"
        };
        setCreditNotes([newCreditNote, ...creditNotes]);
        alert(`Credit Note ${docNo} generated successfully! ₹${refundAmt} deducted from customer ledger.`);
        setActiveModal(null);
      };

      // Formatted WhatsApp Text
      const getWhatsAppText = (order) => {
        if (!order) return "";
        return `*${SEED_COMPANY.name}*
${SEED_COMPANY.address}
GSTIN: *${SEED_COMPANY.gstin}* | Ph: ${SEED_COMPANY.phone}
━━━━━━━━━━━━━━━━━━━━
📄 *${order.invoice_series === 'GST_INVOICE' ? 'TAX INVOICE' : 'ESTIMATE VOUCHER'}*
🔢 *Doc No:* ${order.invoice_number}
📅 *Date:* ${order.order_date}
👤 *Client:* ${order.client_name}
📍 *Channel:* ${order.is_geofence_verified ? '✅ 100m Geo-Verified Field Visit' : '📞 Phone Call Order'}
━━━━━━━━━━━━━━━━━━━━
📦 *ITEMS:*
${order.items.map((it, idx) => `${idx + 1}. *${it.name}* (${it.quantity} PCS) = ₹${(it.price * it.quantity).toLocaleString()}`).join('\n')}
━━━━━━━━━━━━━━━━━━━━
💰 *LEDGER BREAKDOWN:*
• Current Order Total: ₹${order.currentOrderTotal.toLocaleString()}
• Previous Outstanding: ₹${order.previousOutstanding.toLocaleString()}
• Paid/Advance Today: ₹${order.paidToday.toLocaleString()}
━━━━━━━━━━━━━━━━━━━━
🔴 *NET BALANCE DUE: ₹${order.netBalanceDue.toLocaleString()}*
━━━━━━━━━━━━━━━━━━━━
💳 *PAY VIA UPI:*
UPI ID: \`${SEED_COMPANY.bank_details.upi_id}\`
Bank: ${SEED_COMPANY.bank_details.bank_name} | IFSC: ${SEED_COMPANY.bank_details.ifsc}`;
      };

      return (
        <div className="max-w-7xl mx-auto pb-12">
          {/* Header & Role Switcher */}

                              {ord.invoice_series === 'GST_INVOICE' ? 'GST INVOICE' : 'NON-GST EST'}
                            </span>
                          </td>
                          <td className="py-3 px-4 font-semibold text-slate-800">{ord.client_name}</td>
                          <td className="py-3 px-4">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-medium ${ord.is_geofence_verified ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
                              {ord.is_geofence_verified ? '✅ 100m Field Visit' : '📞 Phone Order'}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right font-mono font-bold">₹{ord.currentOrderTotal.toLocaleString()}</td>
                          <td className="py-3 px-4 text-right font-mono text-emerald-600 font-bold">₹{ord.paidToday.toLocaleString()}</td>
                          <td className="py-3 px-4 text-right font-mono text-rose-600 font-bold">₹{ord.netBalanceDue.toLocaleString()}</td>
                          <td className="py-3 px-4 text-center">
                            <button
                              onClick={() => {
                                setLastGeneratedOrder(ord);
                                setActiveModal('WHATSAPP_SHARE');
                              }}
                              className="px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px]"
                            >
                              Share PDF
                            </button>
                          </td>
                        </tr>
                      ))}
                      {orders.length === 0 && (
                        <tr>
                          <td colSpan="8" className="py-8 text-center text-slate-400">
                            No orders booked yet. Switch to "Field Sales" mode above to book the first order!
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* ========================================================================= */}
          {/* MODAL 1: 1-CLICK WHATSAPP SHARE & PRINTABLE RECEIPT                      */}
          {/* ========================================================================= */}
          {activeModal === 'WHATSAPP_SHARE' && lastGeneratedOrder && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center">
                      <Icon name="whatsapp" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">1-Click WhatsApp Invoice Ready</h3>
                      <p className="text-xs text-slate-500">Doc: {lastGeneratedOrder.invoice_number}</p>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                {/* WhatsApp Text Preview */}
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs font-mono text-slate-800 whitespace-pre-wrap max-h-60 overflow-y-auto no-scrollbar">
                  {getWhatsAppText(lastGeneratedOrder)}
                </div>

                <div className="flex space-x-2">
                  <a
                    href={`https://wa.me/?text=${encodeURIComponent(getWhatsAppText(lastGeneratedOrder))}`}
                    target="_blank"
                    rel="noreferrer"
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center space-x-1.5 shadow"
                  >
                    <Icon name="whatsapp" className="w-4 h-4" />
                    <span>Send on WhatsApp</span>
                  </a>

                  <button
                    onClick={() => {
                      window.print();
                    }}
                    className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs flex items-center space-x-1"
                  >
                    <Icon name="receipt" className="w-4 h-4" />
                    <span>Print PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 2: 15-20 DAYS SALES RETURN & CREDIT NOTE                           */}
          {/* ========================================================================= */}
          {activeModal === 'SALES_RETURN' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form onSubmit={handleProcessReturn} className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-800 text-sm">15-20 Days Sales Return Flow</h3>
                  <button type="button" onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-600">Client Name</label>
                    <input type="text" readOnly value={selectedClient.company_name} className="w-full mt-1 bg-slate-100 border border-slate-200 rounded-lg p-2 font-medium text-slate-700" />
                  </div>

                  <div>
                    <label className="font-semibold text-slate-600">Original Invoice Number</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. INV/26-27/0041"
                      value={returnForm.invoiceNo}
                      onChange={(e) => setReturnForm({ ...returnForm, invoiceNo: e.target.value })}
                      className="w-full mt-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-mono font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-600">Return Quantity</label>
                      <input
                        type="number"
                        min="1"
                        value={returnForm.qty}
                        onChange={(e) => setReturnForm({ ...returnForm, qty: e.target.value })}
                        className="w-full mt-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-bold"
                      />
                    </div>

                    <div>
                      <label className="font-semibold text-slate-600">Restock Destination</label>
                      <select
                        value={returnForm.destination}
                        onChange={(e) => setReturnForm({ ...returnForm, destination: e.target.value })}
                        className="w-full mt-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-semibold"
                      >
                        <option value="RESELLABLE">Resellable Stock (Warehouse)</option>
                        <option value="DAMAGED">Damaged Quarantine Stock</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-600">Reason for Return</label>
                    <textarea
                      rows="2"
                      placeholder="Wrong specification / transit defect..."
                      value={returnForm.reason}
                      onChange={(e) => setReturnForm({ ...returnForm, reason: e.target.value })}
                      className="w-full mt-1 bg-slate-50 border border-slate-300 rounded-lg p-2"
                    ></textarea>
                  </div>
                </div>

                <button type="submit" className="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md">
                  Issue Credit Note & Deduct Balance
                </button>
              </form>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 3: SALES REP PAYROLL & COMMISSION WALLET                           */}
          {/* ========================================================================= */}
          {activeModal === 'PAYROLL_SLIP' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="font-bold text-slate-800 text-sm">Monthly Payroll & Commission</h3>
                    <p className="text-xs text-slate-500">Ramesh Patil - Month of November 2026</p>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
                </div>

                <div className="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs space-y-2">
                  <div className="flex justify-between">
                    <span className="text-slate-600">Verified Attendance (26 Days):</span>
                    <span className="font-bold text-slate-800">₹22,000 (Base)</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Commission on Collections (2% of ₹3.5L):</span>
                    <span className="font-bold text-emerald-600">+₹7,000</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 pt-1 text-rose-600">
                    <span>(-) Cash Collected from Clients (In-hand liability):</span>
                    <span className="font-bold">-₹8,500</span>
                  </div>
                  <div className="flex justify-between text-rose-600">
                    <span>(-) Salary Advance:</span>
                    <span className="font-bold">-₹2,000</span>
                  </div>
                  <div className="flex justify-between border-t-2 border-slate-300 pt-2 text-sm font-extrabold text-blue-900">
                    <span>NET TAKE-HOME PAYOUT:</span>
                    <span>₹18,500</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    alert("Salary slip downloaded as PDF.");
                    setActiveModal(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow"
                >
                  Download Verified Salary Slip (PDF)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
