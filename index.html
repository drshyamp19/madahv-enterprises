    // --- Simple Indian Date Format Helper (DD-MM-YYYY) ---
    function formatDDMMYYYY(dateInput) {
      if (!dateInput) return '';
      if (/^\d{2}-\d{2}-\d{4}$/.test(dateInput)) return dateInput;
      if (/^\d{4}-\d{2}-\d{2}/.test(dateInput)) {
        const parts = String(dateInput).split('T')[0].split('-');
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function getTodayDDMMYYYY() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}-${month}-${year}`;
    }

        }
        if (itemSearch.trim()) {
          const q = itemSearch.toLowerCase();
          list = list.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.sku.toLowerCase().includes(q) ||
            (p.hsn && p.hsn.toLowerCase().includes(q)) ||
            (p.category && p.category.toLowerCase().includes(q))
          );
        }
        return list;
      }, [products, itemSearch, selectedCategory]);

      // Distance calculation
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 45;
        const R = 6371e3;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      };

      const clientDistance = useMemo(() => {
        return calculateDistance(currentRepLat, currentRepLng, selectedClient.lat, selectedClient.lng);
      }, [currentRepLat, currentRepLng, selectedClient]);

      const isWithin100m = clientDistance <= 100;

      const togglePunch = () => {
        if (!isPunchedIn) {
          setIsPunchedIn(true);
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setPunchInTime(time);
        } else {
          if (confirm(`${activeSalesman.name} यांच्यासाठी दिवस पूर्ण (Punch Out) करायचे का?`)) {
            setIsPunchedIn(false);
            setPunchInTime(null);
          }
        }
      };

      // Effective Price Helper: On-site rate decided by salesperson has priority!
      const getProductPrice = (product) => {
        if (customRates[product.id] !== undefined && customRates[product.id] !== '') {
          return Number(customRates[product.id]);
        }
        return product.price;
      };

      // Add to Cart with flexible on-site rate
      const addToCart = (product, qty = 1, customPrice = null) => {
        const availableStock = product.physical - product.booked;
        if (qty > 0 && availableStock <= 0) {
          alert(`${product.name} चा स्टॉक संपला आहे! कृपया खालील पर्यायी वस्तू निवडा.`);
          return;
        }

        const existing = cart.find(item => item.product_id === product.id);
        const currentCartQty = existing ? existing.quantity : 0;
        const newQty = currentCartQty + qty;

        if (qty > 0 && newQty > availableStock) {
          alert(`उपलब्ध साठ्यापेक्षा (${availableStock} नग) जास्त बुक करता येत नाही.`);
          return;
        }

        if (newQty <= 0) {
          // Cleanly remove from cart when quantity reaches 0
          setCart(cart.filter(item => item.product_id !== product.id));
          return;
        }

        const effectivePrice = customPrice !== null ? customPrice : getProductPrice(product);

        if (existing) {
          setCart(cart.map(item => item.product_id === product.id ? { ...item, quantity: newQty } : item));
        } else {
          setCart([...cart, {
            product_id: product.id,
            name: product.name,
            sku: product.sku || '',
            price: effectivePrice,
            tax_rate: (currentFirmKey === 'MADHAV' && invoiceSeries === 'GST_INVOICE') ? (product.tax_rate || 18) : 0,
            hsn: product.hsn || '',
            quantity: newQty
          }]);
        }
      };

      // Direct Quantity update in Cart
      const updateCartItemQty = (productId, newQty) => {
        const q = parseInt(newQty) || 0;
        if (q <= 0) {
          setCart(cart.filter(item => item.product_id !== productId));
        } else {
          const product = products.find(p => p.id === productId);
          const availableStock = product ? (product.physical - product.booked) : 9999;
          if (product && q > availableStock) {
            alert(`गोदामात केवळ ${availableStock} नग उपलब्ध आहेत!`);
            return;
          }
          setCart(cart.map(item => item.product_id === productId ? { ...item, quantity: q } : item));
        }
      };

      // Direct Price update in Cart
      const updateCartItemPrice = (productId, newPrice) => {
        const p = Math.max(0, parseFloat(newPrice) || 0);
        setCart(cart.map(item => item.product_id === productId ? { ...item, price: p } : item));
      };

      // Add Custom / Unlisted Spare Item directly to cart
      const handleAddCustomItemToCart = () => {
        if (!customItemForm.name.trim()) {
          alert("कृपया सुट्या भागाचे किंवा वस्तूचे नाव टाका!");
          return;
        }
        const qty = Math.max(1, parseInt(customItemForm.qty) || 1);
        const price = Math.max(0, parseFloat(customItemForm.price) || 0);
        const tax = (currentFirmKey === 'MADHAV' && invoiceSeries === 'GST_INVOICE') ? (Number(customItemForm.tax_rate) || 18) : 0;
        const customId = `custom-item-${Date.now()}`;

        setCart(prev => [...prev, {
          product_id: customId,
          name: customItemForm.name.trim(),
          sku: customItemForm.sku.trim() || 'CUSTOM-PART',
          price: price,
          tax_rate: tax,
          hsn: customItemForm.hsn.trim() || '7615',
          quantity: qty,
          isCustom: true
        }]);

        setActiveModal(null);
        setCustomItemForm({ name: '', sku: '', qty: 1, price: 150, tax_rate: 18, hsn: '7615' });
        alert(`✅ सुटा भाग / माल बिलात जोडला: ${customItemForm.name} (${qty} नग @ ₹${price})!`);
      };

      // Bill Summary & Vyapar Formula
      const billSummary = useMemo(() => {
        let subtotal = 0;
        let cgst = 0;
        let sgst = 0;
        let igst = 0;

        cart.forEach(item => {
          const itemTaxable = item.price * item.quantity;
          subtotal += itemTaxable;

          if (invoiceSeries === "GST_INVOICE" && currentFirm.isGst) {
            const taxRate = item.tax_rate || 18;
            const taxAmt = (itemTaxable * taxRate) / 100;
            if (selectedClient.state_code === currentFirm.state_code) {
              cgst += taxAmt / 2;
              sgst += taxAmt / 2;
            } else {
              igst += taxAmt;
            }
          }
        });

        const totalTax = cgst + sgst + igst;
        const currentOrderTotal = subtotal + totalTax;
        const previousOutstanding = selectedClient.outstanding || 0;
        const paidToday = Number(paidTodayInput) || 0;
        const netBalanceDue = Math.max(0, currentOrderTotal + previousOutstanding - paidToday);

        return {
          subtotal,
          cgst,
          sgst,
          igst,
          totalTax,
          currentOrderTotal,
          previousOutstanding,
          paidToday,
          netBalanceDue
        };
      }, [cart, invoiceSeries, currentFirm, selectedClient, paidTodayInput]);

      // Order Booking Handler
      const handleCreateOrder = () => {
        if (!isPunchedIn) {

एकूण बाकी: ₹${billSummary.netBalanceDue.toLocaleString()} (मर्यादा ₹${selectedClient.credit_limit.toLocaleString()} पेक्षा ₹${excess.toLocaleString()} जास्त).
तरीही ऑर्डर बुक करायची का?`);

        let docNo = "";

            : activeSalesman.name,
          salesman_phone: activeSalesman.phone,
          invoice_number: docNo,
          invoice_series: invoiceSeries,
          client_id: selectedClient.id,
          client_name: selectedClient.company_name,
          client_phone: selectedClient.phone,
          order_channel: isWithin100m ? "FIELD_VISIT" : "PHONE_CALL",
          is_geofence_verified: isWithin100m,
          order_date: getTodayDDMMYYYY(),
          items: [...cart],
          ...billSummary
        };

        // Update Booked stock for standard items
        setProducts(prevProducts =>
          prevProducts.map(p => {
            const item = cart.find(ci => ci.product_id === p.id);
            if (item) {
              return { ...p, booked: p.booked + item.quantity };
            }
            return p;
          })
        );

        // Update Client outstanding
        selectedClient.outstanding = billSummary.netBalanceDue;

        // If payment collected today, log to daily collections
        if (Number(paidTodayInput) > 0) {
          const newCol = {
            firm: currentFirmKey,
            party: selectedClient.company_name,
            date: getTodayDDMMYYYY(),
            amount: Number(paidTodayInput),
            mode: "CASH",
            collector: activeSalesman.name
          };
          setDailyCollections(prev => [newCol, ...prev]);
        }

        setOrdersHistory(prev => [newOrder, ...prev]);
        setLastGeneratedOrder(newOrder);
        setCart([]);
        setPaidTodayInput(0);
        setActiveModal('WHATSAPP_SHARE');
      };

      const getWhatsAppText = (order) => {
        if (!order) return "";
        const isGstFirm = order.firm_id === "MADHAV";
        const firmInfo = MASTER_FIRMS[order.firm_id] || currentFirm;

        return `🏢 *${firmInfo.name}*
${firmInfo.address}
${isGstFirm ? `GSTIN: *${firmInfo.gstin}* | मो: ${firmInfo.phone}` : `मो: ${firmInfo.phone} (Non-GST / रोख)`}
━━━━━━━━━━━━━━━━━━━━
📄 *${order.invoice_series === 'GST_INVOICE' ? 'टॅक्स इनव्हॉईस (TAX INVOICE)' : 'रिटेल एस्टिमेट / कॅश मेमो'}*
🔢 *बिल क्रमांक:* ${order.invoice_number}

📍 *ऑर्डर चॅनेल:* ${order.is_geofence_verified ? '✅ 100m प्रत्यक्ष भेट (Field Visit)' : '📞 फोन कॉल ऑर्डर'}
━━━━━━━━━━━━━━━━━━━━
📦 *ऑर्डर तपशील:*
${order.items.map((it, idx) => `${idx + 1}. *${it.name}* (${it.quantity} नग) @ ₹${it.price} = ₹${(it.price * it.quantity).toLocaleString()}`).join(String.fromCharCode(10))}
━━━━━━━━━━━━━━━━━━━━
💰 *हिशोब व खाते उतारा:*
• चालू ऑर्डर रक्कम: ₹${order.currentOrderTotal.toLocaleString()}
• मागील बाकी (Outstanding): ₹${order.previousOutstanding.toLocaleString()}
• आज जमा रक्कम: ₹${order.paidToday.toLocaleString()}
━━━━━━━━━━━━━━━━━━━━
🔴 *एकूण येणे बाकी: ₹${order.netBalanceDue.toLocaleString()}*
━━━━━━━━━━━━━━━━━━━━
ऑर्डर बुकर: *${order.salesman_name}* (${order.salesman_phone})
धन्यवाद! 🙏 *${firmInfo.name}, इंदोरा नागपूर*`;
      };

      // Consolidated Tempo Dispatch Loading Sheet computation
      const tempoLoadingSummary = useMemo(() => {
        const bookedOrders = ordersHistory.filter(o => o.status === 'BOOKED');
        const itemMap = {};
        bookedOrders.forEach(ord => {
          (ord.items || []).forEach(it => {
            const key = it.product_id || it.name;
            if (!itemMap[key]) {
              const matchedProd = products.find(p => p.id === it.product_id);
              itemMap[key] = {
                id: key,
                name: it.name,
                sku: it.sku || '-',
                hsn: it.hsn || '-',
                totalBookedQty: 0,
                physicalStock: matchedProd ? matchedProd.physical : 'N/A',
                availableStock: matchedProd ? (matchedProd.physical - matchedProd.booked) : 'N/A'
              };
            }
            itemMap[key].totalBookedQty += it.quantity;
          });
        });
        return {
          bookedOrders,
          summaryItems: Object.values(itemMap),
          totalOrdersCount: bookedOrders.length,
          totalUnitsCount: Object.values(itemMap).reduce((s, it) => s + it.totalBookedQty, 0)
        };
      }, [ordersHistory, products]);

      return (
        <div className="max-w-7xl mx-auto pb-12 font-sans text-slate-800">
          {/* Header with 2-Firm Switcher & Profile Dropdown */}
          <header className="bg-slate-900 text-white sticky top-0 z-40 shadow-lg px-4 py-3 flex flex-wrap items-center justify-between gap-3 border-b border-slate-800">
            <div className="flex items-center space-x-3">
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl shadow-md ${
                currentFirmKey === 'MADHAV' ? 'bg-blue-600 shadow-blue-500/30' : 'bg-emerald-600 shadow-emerald-500/30'
              }`}>
                {currentFirmKey === 'MADHAV' ? 'M' : 'S'}
              </div>
              <div>
                <h1 className="font-extrabold text-sm md:text-base leading-tight tracking-wide flex items-center gap-2">
                  <span>{currentFirm.name}</span>
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                    currentFirmKey === 'MADHAV' ? 'bg-blue-900/80 text-blue-300 border border-blue-700' : 'bg-emerald-900/80 text-emerald-300 border border-emerald-700'
                  }`}>
                    {currentFirmKey === 'MADHAV' ? 'ग्रीन शेफ अधिकृत वितरक (GST)' : 'शिवओम Non-GST / रोख व स्पेअर्स'}
                  </span>
                </h1>
                <p className="text-xs text-slate-400">
                  {currentFirmKey === 'MADHAV' ? 'GSTIN: 27BQIPP3836Q1ZZ' : 'Non-GST / कॅश एस्टिमेट्स'} | 
                  सक्रिय: <b className="text-amber-400">{currentUser.avatar} {currentUser.nameMr}</b> ({currentUser.badge})
                </p>
              </div>
            </div>

            {/* Top Bar Controls */}
            <div className="flex flex-wrap items-center gap-2 relative">
              {/* Profile Selector Dropdown */}
              <div className="relative">
                <button
                  onClick={() => setIsProfileDropdownOpen(!isProfileDropdownOpen)}
                  className="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center space-x-1.5 text-xs font-bold transition-all shadow-sm"
                >
                  <span>{currentUser.avatar}</span>

                      alert(`✅ नवीन पार्टी यशस्वीरित्या जोडली: ${formattedParty.company_name}!`);
                    }}
                    className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow"
                  >
                    💾 सेव्ह व पार्टी निवडा
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: STOCK INWARD (नवीन माल आवक) */}
          {activeModal === 'STOCK_INWARD' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center font-bold">
                      📥
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">गोदाम माल आवक (Stock Inward)</h3>
                      <p className="text-xs text-slate-500">गोदामात फिजिकल स्टॉक वाढवा</p>
                    </div>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">वस्तू निवडा *</label>
                    <select
                      value={stockInwardForm.productId || (products[0] && products[0].id)}
                      onChange={(e) => setStockInwardForm({ ...stockInwardForm, productId: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-blue-600 focus:bg-white text-xs font-bold text-slate-800"
                    >
                      {products.map(p => (
                        <option key={p.id} value={p.id}>
                          {p.name} (गोदाम: {p.physical} | बुक: {p.booked} | शिल्लक: {p.physical - p.booked})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">आवक नग (Quantity) *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={stockInwardForm.quantity}
                        onChange={(e) => setStockInwardForm({ ...stockInwardForm, quantity: Math.max(1, parseInt(e.target.value) || 1) })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-blue-600 focus:bg-white text-xs font-bold text-blue-700"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-bold mb-1">आवक तारीख</label>
                      <input
                        type="text"
                        value={stockInwardForm.date}
                        onChange={(e) => setStockInwardForm({ ...stockInwardForm, date: e.target.value })}
                        placeholder="DD-MM-YYYY"
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-blue-600 focus:bg-white text-xs text-slate-800 font-mono font-bold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 font-bold mb-1">सप्लायर / टेम्पो / बिल संदर्भ</label>
                    <input
                      type="text"
                      placeholder="उदा. ग्रीन शेफ फॅक्टरी टेम्पो #MH-31-AP-8921"
                      value={stockInwardForm.supplierRef}
                      onChange={(e) => setStockInwardForm({ ...stockInwardForm, supplierRef: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-blue-600 focus:bg-white text-xs text-slate-800"
                    />
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100 flex space-x-2">
                  <button
                    type="button"
                    onClick={() => setActiveModal(null)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                  >
                    रद्द करा
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const prodId = stockInwardForm.productId || (products[0] && products[0].id);
                      const qty = Number(stockInwardForm.quantity) || 1;
                      let targetProdName = '';
                      setProducts(prev => prev.map(p => {
                        if (p.id === prodId) {
                          targetProdName = p.name;
                          return { ...p, physical: p.physical + qty };
                        }
                        return p;
                      }));
                      setActiveModal(null);
                      alert(`✅ गोदामात माल जमा झाला: ${targetProdName} (+${qty} नग गोदामात वाढवले)!`);
                    }}
                    className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow"
                  >
                    📥 माल जमा करा
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DISPATCH ORDER */}
          {activeModal === 'DISPATCH_NOTE' && dispatchModalOrder && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
                      🚚
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">माल टेम्पोत रवाना करा (Mark Dispatched)</h3>
                      <p className="text-xs text-slate-500">{dispatchModalOrder.invoice_number} · {dispatchModalOrder.client_name}</p>
                    </div>
                  </div>
                  <button onClick={() => { setActiveModal(null); setDispatchModalOrder(null); }} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                  <div className="font-bold text-slate-800">पार्टी: {dispatchModalOrder.client_name}</div>
                  <div className="text-slate-600">रक्कम: ₹{(dispatchModalOrder.currentOrderTotal || 0).toLocaleString()} (बाकी: ₹{(dispatchModalOrder.netBalanceDue || 0).toLocaleString()})</div>
                  <div className="text-slate-500">आयटम्स: {(dispatchModalOrder.items || []).map(it => `${it.quantity}x ${it.name}`).join(', ')}</div>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 font-bold mb-1">गाडी / ड्रायव्हर / डिलिव्हरी नोट *</label>
                    <input
                      type="text"
                      placeholder="उदा. टेम्पो MH-31-DC-4421 / ड्रायव्हर: रमेश (9823000000)"
                      value={vehicleNoteInput}
                      onChange={(e) => setVehicleNoteInput(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:border-amber-600 focus:bg-white text-xs font-bold text-slate-800"
                    />
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100 flex space-x-2">
                  <button
                    type="button"
                    onClick={() => { setActiveModal(null); setDispatchModalOrder(null); }}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                  >
                    रद्द करा
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const note = vehicleNoteInput.trim() || 'इंडोरा गोदामातून टेम्पोत रवाना';
                      setOrdersHistory(prev => prev.map(ord => {
                        if (ord.id === dispatchModalOrder.id) {
                          return {
                            ...ord,
                            status: 'DISPATCHED',
                            vehicle_note: note,
                            dispatched_at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                          };
                        }
                        return ord;
                      }));

                      // Deduct physical & booked stock as goods leave warehouse
                      setProducts(prev => prev.map(p => {
                        const it = (dispatchModalOrder.items || []).find(ci => ci.product_id === p.id);
                        if (it) {
                          return {
                            ...p,
                            physical: Math.max(0, p.physical - it.quantity),
                            booked: Math.max(0, p.booked - it.quantity)
                          };
                        }
                        return p;
                      }));

                      setActiveModal(null);
                      setDispatchModalOrder(null);
                      setVehicleNoteInput('');
                      alert(`🚚 ऑर्डर रवाना (Dispatched) झाली! गोदामातून माल वजा झाला आणि गाडी निघाली.`);
                    }}
                    className="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl shadow"
                  >
                    🚚 डिस्पॅच कन्फर्म करा
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: EDIT CREDIT LIMIT */}
          {activeModal === 'EDIT_CREDIT_LIMIT' && editLimitParty && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-1.5">
                      <span>✏️ क्रेडिट मर्यादा बदला (Admin Authority)</span>
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">{editLimitParty.company_name}</p>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div className="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs space-y-1">
                  <div className="flex justify-between text-slate-600">
                    <span>चालू येणे बाकी:</span>
                    <span className="font-extrabold text-rose-600 font-mono">₹{(editLimitParty.outstanding || 0).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between text-slate-600">
                    <span>सध्याची क्रेडिट मर्यादा:</span>
                    <span className="font-bold text-slate-800 font-mono">₹{(editLimitParty.credit_limit || 10000).toLocaleString()}</span>
                  </div>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">द्रुत मर्यादा निवडी (Presets):</label>
                    <div className="grid grid-cols-4 gap-1.5 mt-1.5">
                      {[10000, 25000, 50000, 100000].map(amt => (
                        <button
                          key={amt}
                          type="button"
                          onClick={() => setCustomLimitInput(amt)}
                          className={`py-1.5 rounded-lg font-bold text-xs border transition-all ${
                            Number(customLimitInput) === amt
                              ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                              : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                          }`}
                        >
                          ₹{(amt / 1000)}K
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">नवीन क्रेडिट मर्यादा रक्कम (₹):</label>
                    <div className="relative mt-1">
                      <span className="absolute left-3 top-2.5 text-slate-400 font-bold text-sm">₹</span>
                      <input
                        type="number"
                        value={customLimitInput}
                        onChange={(e) => setCustomLimitInput(e.target.value)}
                        placeholder="उदा. 50000"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl pl-8 pr-3 py-2 font-mono font-extrabold text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700">पेमेंट मुदत (Credit Days):</label>
                    <div className="grid grid-cols-4 gap-1.5 mt-1.5">
                      {[7, 15, 30, 45].map(days => (
                        <button
                          key={days}
                          type="button"
                          onClick={() => setCustomDaysInput(days)}
                          className={`py-1.5 rounded-lg font-bold text-xs border transition-all ${
                            Number(customDaysInput) === days
                              ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                              : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                          }`}
                        >
                          {days} दिवस
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex space-x-2 pt-2 border-t border-slate-100">
                  <button
                    onClick={() => setActiveModal(null)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs"
                  >
                    रद्द करा
                  </button>
                  <button
                    onClick={() => handleUpdateCreditLimit(editLimitParty.id, customLimitInput, customDaysInput)}
                    className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs shadow-md"
                  >
                    मर्यादा सेव्ह करा
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: PAYROLL & WALLET */}
          {activeModal === 'PAYROLL_SLIP' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h3 className="font-bold text-slate-800 text-sm">मासिक पगार व वॉलेट पावती</h3>
                    <p className="text-xs text-slate-500">{activeSalesman.name} ({currentFirm.name})</p>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
                </div>

                <div className="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs space-y-2">
                  <div className="flex justify-between">
                    <span className="text-slate-600">मूळ पगार (२६ हजेरी दिवस):</span>
                    <span className="font-bold text-slate-800">₹{activeSalesman.base_salary.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">मिळालेले कमिशन / इन्सेंटिव्ह:</span>
                    <span className="font-bold text-emerald-600">+₹7,500</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 pt-1 text-rose-600">
                    <span>(-) हातातील शिल्लक कॅश देयता:</span>
                    <span className="font-bold">-₹{activeSalesman.cash_in_hand.toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between border-t-2 border-slate-300 pt-2 text-sm font-extrabold text-blue-900">
                    <span>एकूण देय पगार (Net Payout):</span>
                    <span>₹{Math.max(0, activeSalesman.base_salary + 7500 - activeSalesman.cash_in_hand).toLocaleString()}</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    alert("पगार पावती PDF स्वरूपात डाऊनलोड झाली.");
                    setActiveModal(null);
                  }}
                  className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow"
                >
                  पगार पावती डाऊनलोड करा (PDF)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }


    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    } else {
      ReactDOM.render(<App />, container);
    }
  </script>
</body>
</html>
